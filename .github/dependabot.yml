version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # One catch-all group: every update type, compile and test scope, lands in a
      # single PR per cycle. The previous split (dev minor+patch / prod patch) left
      # production minors and all majors ungrouped, and each of those became its own
      # PR -- that was the actual source of the PR flood, not the weekly cadence.
      all-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
