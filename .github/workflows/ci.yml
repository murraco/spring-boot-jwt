name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
